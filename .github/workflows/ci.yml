name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t lint typecheck test build

  docker:
    runs-on: ubuntu-latest
    needs: main
    steps:
      - uses: actions/checkout@v5

      # Validates both Dockerfiles still build — no registry configured to push to yet, so this
      # is a build-only check (see docs/15_DEVOPS_SPECIFICATION.md for the target CI/CD shape).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: false
