# Template only — never commit real values here. Copy to api-secret.yaml (already .gitignore'd
# below via k8s/*.secret.yaml is NOT the pattern used; instead create it directly with kubectl,
# e.g.:
#   kubectl create secret generic api-secrets -n tag-platform \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#     --from-literal=JWT_ACCESS_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
# This file exists only to document the two required keys (plus the optional Twilio ones,
# which enable SMS one-time codes for MFA — leave them out and SMS is simply not offered).
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: tag-platform
type: Opaque
stringData:
  SUPABASE_SERVICE_ROLE_KEY: ''
  JWT_ACCESS_SECRET: ''
  # Optional — SMS MFA (Twilio). Set TWILIO_FROM_NUMBER or TWILIO_MESSAGING_SERVICE_SID.
  TWILIO_ACCOUNT_SID: ''
  TWILIO_AUTH_TOKEN: ''
  TWILIO_FROM_NUMBER: ''
  TWILIO_MESSAGING_SERVICE_SID: ''
