services:
  - type: web
    name: tag-platform-api
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required here: NODE_ENV=production below makes a plain `npm install`
    # skip devDependencies (nx, webpack-cli, typescript, @nx/webpack...) — exactly the tools
    # this build needs. Without it, `npx nx build api` fails with "nx: command not found".
    buildCommand: npm install --include=dev && npx nx build api
    startCommand: node packages/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Nx tries to spawn a background daemon for faster repeat builds; that daemon process
      # commonly fails to start in ephemeral/sandboxed cloud build containers (Render included),
      # which can hang or error the build. Disabling it makes every build a clean one-shot run.
      - key: NX_DAEMON
        value: "false"
      # The deployed site's address(es), e.g. https://tour-avant-garde.vercel.app — the CORS
      # allow-list (several separated by commas), see packages/api/src/main.ts.
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN_SECONDS
        value: "900"
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: "30"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # Voix naturelle (Google Text-to-Speech, Chirp 3 HD) et traduction de la salle (Google
      # Translation) : une clé API Google Cloud avec ces deux API activées. Sans elle, la salle reste
      # en français et la voix de l'appareil lit la prière.
      - key: GOOGLE_CLOUD_API_KEY
        sync: false
      # E-mails par Gmail (sans SMS ni domaine) : un petit script Google publié par le titulaire du
      # compte Gmail (docs/gmail-relay.gs). Prioritaire sur Brevo quand il est réglé.
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      # E-mails (vérification, mot de passe oublié, codes) via Brevo — gratuit jusqu'à 300/jour.
      # Sans ces deux valeurs, les e-mails sont seulement enregistrés, pas envoyés.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: "Tour d'avant-garde"
      # Optional — SMS one-time codes for MFA (Twilio). Leave unset and the login screen simply
      # doesn't offer SMS. Set either TWILIO_FROM_NUMBER (E.164, e.g. +15005550006) or
      # TWILIO_MESSAGING_SERVICE_SID (recommended for international sending).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
